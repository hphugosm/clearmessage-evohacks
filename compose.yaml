name: clearmessage
services:
  app:
    build: .
    image: clearmessage:release
    ports:
      - "127.0.0.1:7860:7860"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: 1.0
    mem_limit: 512m
    pids_limit: 64
    restart: "no"
    networks:
      - offline
networks:
  offline:
    internal: true
